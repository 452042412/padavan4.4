name: build-R6800

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        toolchain: [mipsel-linux-musl]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 推荐用支持 NETGEAR-BZV 的 chongshengB/padavan-4.4 分支
          repository: chongshengB/padavan-4.4
          ref: master
          fetch-depth: 0

      - name: ccache cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: netgear-bzv-${{ matrix.toolchain }}
          max-size: "5G"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y build-essential cmake flex bison gawk git \
          libtool-bin gperf python3-docutils autopoint gettext ccache \
          zlib1g-dev libssl-dev libncurses5-dev unzip zip

      # 关键：用 NETGEAR-BZV 作为编译目标
      - name: Build firmware
        run: |
          make NETGEAR-BZV TOOLCHAIN=${{ matrix.toolchain }} V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: R6800-firmware
          path: |
            trunk/images/NETGEAR-BZV*.trx
            trunk/images/NETGEAR-BZV*.chk
          if-no-files-found: error
